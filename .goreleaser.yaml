version: 2

# COPR builds in mock, which has no network, and the source tarball below is a
# git archive that can't carry untracked vendor/. Ship deps as a side tarball
# instead of committing vendor/, which would break every dependency-bump PR.
# Written to the repo root, not dist/: before-hooks run ahead of the step that
# asserts dist/ is empty, so writing there aborts the build. Untracked, so
# `git archive` keeps it out of the source tarball.
before:
  hooks:
    - go mod vendor
    - tar -czf {{ .ProjectName }}-{{ .Version }}-vendor.tar.gz vendor

builds:
  - id: netdoc
    binary: netdoc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
  # Linux only, on purpose. netdoc-sim compiles everywhere — internal/simulation
  # has a !linux backend that returns ErrUnsupported so the CLI links — but the
  # only backend that can build a network is Linux namespaces, so a macOS or
  # Windows artifact would be a binary whose every real command refuses. Same
  # tag, same version, same release as netdoc; it is a companion, not a product.
  - id: netdoc-sim
    binary: netdoc-sim
    main: ./cmd/netdoc-sim
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

# One archive per build, so the taps below can name the one they publish.
# Both keep the default binary-format name template, which starts with
# {{ .Binary }}: netdoc's release filenames are byte-for-byte what they were,
# and netdoc-sim gets its own rather than colliding with them.
archives:
  - id: netdoc
    ids: [netdoc]
    formats: [binary]
    # winget and Scoop both refuse a bare binary; Windows gets a zip instead.
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: netdoc-sim
    ids: [netdoc-sim]
    formats: [binary]

source:
  enabled: true
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"

checksum:
  name_template: "checksums.txt"
  # The vendor tarball is what COPR actually compiles, so it has to be a
  # checksums.txt subject like everything else — that is what the release
  # attestation covers, and what the copr job verifies before building.
  extra_files:
    - glob: ./network-doctor-*-vendor.tar.gz

release:
  extra_files:
    - glob: ./network-doctor-*-vendor.tar.gz

# Distro-agnostic packages installed straight off the release page: apt, dnf,
# apk. Repo-based installs go through COPR instead, which builds its own.
#
# No `ids` filter: every Linux build goes in, so one install puts both
# /usr/bin/netdoc and /usr/bin/netdoc-sim on the system at the same version.
# packaging/network-doctor.spec has to keep installing both to match.
nfpms:
  - package_name: network-doctor
    homepage: https://github.com/heymaikol/network-doctor
    description: Terminal UI that diagnoses network connectivity and explains where the connection breaks
    maintainer: Michael Placzek <heymaikol@proton.me>
    license: GPL-3.0-or-later
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/network-doctor/LICENSE
      # Uncompressed: nfpm does not compress, and man reads a plain .1 fine.
      # rpmbuild's brp-compress gzips it in the COPR build, hence the glob in
      # the spec's %files.
      - src: packaging/netdoc.1
        dst: /usr/share/man/man1/netdoc.1
      - src: packaging/completions/netdoc.bash
        dst: /usr/share/bash-completion/completions/netdoc
      - src: packaging/completions/netdoc.zsh
        dst: /usr/share/zsh/site-functions/_netdoc
      - src: packaging/completions/netdoc.fish
        dst: /usr/share/fish/vendor_completions.d/netdoc.fish

# netdoc only, in all three. A tap/bucket/manifest accepts one archive per
# OS+arch, and the simulator is Linux-only anyway: without this filter the
# extra Linux archives make GoReleaser refuse the whole publish.
homebrew_casks:
  - ids: [netdoc]
    repository:
      owner: heymaikol
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/heymaikol/network-doctor
    description: Terminal UI that diagnoses network connectivity and explains where the connection breaks
    # Unsigned binary: strip Gatekeeper quarantine on install (per GoReleaser docs).
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end

# Scoop publishes to our own bucket immediately; winget opens a PR upstream that
# Microsoft reviews, so releases land there some time later.
scoops:
  - ids: [netdoc]
    repository:
      owner: heymaikol
      name: scoop-bucket
      token: "{{ .Env.WINDOWS_PACKAGES_TOKEN }}"
    homepage: https://github.com/heymaikol/network-doctor
    description: Terminal UI that diagnoses network connectivity and explains where the connection breaks
    license: GPL-3.0-or-later

winget:
  - package_name: Network Doctor
    package_identifier: heymaikol.NetworkDoctor
    publisher: Michael Placzek
    publisher_url: https://github.com/heymaikol
    publisher_support_url: https://github.com/heymaikol/network-doctor/issues
    short_description: Terminal UI that diagnoses network connectivity and explains where the connection breaks
    homepage: https://github.com/heymaikol/network-doctor
    license: GPL-3.0-or-later
    tags:
      - cli
      - network
      - diagnostics
    repository:
      owner: heymaikol
      name: winget-pkgs
      token: "{{ .Env.WINDOWS_PACKAGES_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

changelog:
  use: github-native
