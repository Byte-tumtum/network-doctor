version: 2

builds:
  - binary: netdoc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [binary]
    # winget and Scoop both refuse a bare binary; Windows gets a zip instead.
    format_overrides:
      - goos: windows
        formats: [zip]

source:
  enabled: true
  prefix_template: "{{ .ProjectName }}-{{ .Version }}/"

checksum:
  name_template: "checksums.txt"

# Distro-agnostic packages for everything that isn't Arch: apt, dnf, apk all
# install these straight off the release page.
nfpms:
  - package_name: network-doctor
    homepage: https://github.com/heymaikol/network-doctor
    description: Terminal UI that diagnoses network connectivity and explains where the connection breaks
    maintainer: Michael Placzek <heymaikol@proton.me>
    license: GPL-3.0-only
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/network-doctor/LICENSE

aur_sources:
  - homepage: https://github.com/heymaikol/network-doctor
    description: Terminal UI that diagnoses network connectivity and explains where the connection breaks
    license: GPL-3.0-only
    maintainers:
      - Michael Placzek <heymaikol@proton.me>
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/network-doctor.git
    build: |-
      cd "${pkgname}-${pkgver}"
      export CGO_ENABLED=0
      export GOFLAGS="-trimpath -mod=readonly -modcacherw"
      go build -ldflags "-s -w -X main.version=${pkgver}" -o netdoc .
    package: |-
      cd "${pkgname}-${pkgver}"
      install -Dm755 netdoc "${pkgdir}/usr/bin/netdoc"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"

homebrew_casks:
  - repository:
      owner: heymaikol
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/heymaikol/network-doctor
    description: Terminal UI that diagnoses network connectivity and explains where the connection breaks
    # Unsigned binary: strip Gatekeeper quarantine on install (per GoReleaser docs).
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end

# Scoop publishes to our own bucket immediately; winget opens a PR upstream that
# Microsoft reviews, so releases land there some time later.
scoops:
  - repository:
      owner: heymaikol
      name: scoop-bucket
      token: "{{ .Env.WINDOWS_PACKAGES_TOKEN }}"
    homepage: https://github.com/heymaikol/network-doctor
    description: Terminal UI that diagnoses network connectivity and explains where the connection breaks
    license: GPL-3.0-only

winget:
  - package_name: Network Doctor
    package_identifier: heymaikol.NetworkDoctor
    publisher: Michael Placzek
    publisher_url: https://github.com/heymaikol
    publisher_support_url: https://github.com/heymaikol/network-doctor/issues
    short_description: Terminal UI that diagnoses network connectivity and explains where the connection breaks
    homepage: https://github.com/heymaikol/network-doctor
    license: GPL-3.0-only
    tags:
      - cli
      - network
      - diagnostics
    repository:
      owner: heymaikol
      name: winget-pkgs
      token: "{{ .Env.WINDOWS_PACKAGES_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

changelog:
  use: github-native
