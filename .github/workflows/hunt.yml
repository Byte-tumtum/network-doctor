name: hunt

# Nightly deterministic bug hunt: derive one exploration seed from the UTC
# calendar date, mutate the known-good baseline scenarios, reproduce every
# candidate finding from its recorded seed and case, and report the survivors.
# Filing them as issues is opt-in, twice over: a manual run has to ask for it,
# and a scheduled run files nothing until the repository variable
# NETDOC_HUNT_CREATE is set to true. Merging this workflow therefore starts the
# hunting, not the issue writing.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: logical unique cases per baseline before sharding
        default: "60"
      create:
        description: file reproducible findings as GitHub issues
        type: boolean
        default: false

permissions:
  contents: read

# Kept in the same order as simulation.TriageBaselines. A test holds these
# names to the production list so the workflow cannot silently hunt a different
# campaign.
env:
  HUNT_SHARDS: "4"
  HUNT_BASELINES: |
    healthy
    healthy-routed-network
    dual-stack-healthy
    tls-valid
    socks5h-remote-dns-succeeds
    two-path-healthy
    two-path-ipv6-healthy
    two-router-healthy

# The triage report is piped through tee, and the default shell (`bash -e`)
# reports a pipeline's last command, not its first: without pipefail a hunt that
# exits 3 would leave the step green with the failure printed in it. Naming bash
# explicitly is what turns pipefail on, per GitHub's documented shell defaults.
defaults:
  run:
    shell: bash

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  seed:
    name: Resolve UTC exploration seed
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.resolve.outputs.value }}
    steps:
      # Resolve once for the whole workflow. Shards may start at different
      # times, so none of them reads the clock independently.
      - id: resolve
        run: |
          seed=$(LC_ALL=C date -u +%Y%m%d)
          case "$seed" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *) echo "invalid UTC date seed: $seed" >&2; exit 1 ;;
          esac
          printf 'value=%s\n' "$seed" >> "$GITHUB_OUTPUT"
          echo "Exploration seed: $seed"

  hunt:
    name: Explore seed ${{ needs.seed.outputs.value }} shard ${{ matrix.shard }}
    needs: [seed]
    # Not ubuntu-latest. The hunt pins netem randomness with `netem seed`, which
    # iproute2 learned in 6.6; 24.04 ships 6.1 and rejects the keyword, so every
    # generated case that injects loss, latency or jitter fails to set up there.
    # Unseeded netem is not an option: a case that cannot repeat cannot be
    # reproduced, and reproduction is what earns a finding an issue.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o netdoc . && go build -o netdoc-sim ./cmd/netdoc-sim
        env:
          CGO_ENABLED: "0"
      # Ubuntu 24.04 and later deny unprivileged user namespaces through
      # AppArmor, which is the one thing the rootless backend needs. Clearing it
      # on the throwaway runner keeps the hunt rootless; netdoc-sim still
      # refuses to escalate.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # One line in the log answering the first question a setup failure raises.
      - run: tc -V
      - name: Run shard
        env:
          CASES: ${{ inputs.cases || '60' }}
          HUNT_SEED: ${{ needs.seed.outputs.value }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p hunt-results
          while read -r base; do
            [ -n "$base" ] || continue
            output="hunt-results/$base.$SHARD.json"
            if ./netdoc-sim hunt "$base" \
              --seed "$HUNT_SEED" \
              --cases "$CASES" \
              --shard "$SHARD/$HUNT_SHARDS" \
              --max-faults 2 \
              --json > "$output"; then
              continue
            else
              status=$?
            fi
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          done <<< "$HUNT_BASELINES"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hunt-shard-${{ matrix.shard }}
          path: hunt-results
          if-no-files-found: error

  merge:
    name: Merge and triage exploration seed ${{ needs.seed.outputs.value }}
    if: ${{ always() }}
    needs: [seed, hunt]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      # Job permissions cannot be decided per run, so an observation-only run
      # holds this and never uses it. The mode step withholds GH_TOKEN unless
      # this run deliberately creates issues.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -o netdoc . && go build -o netdoc-sim ./cmd/netdoc-sim
        env:
          CGO_ENABLED: "0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hunt-shard-*
          path: hunt-shards
          merge-multiple: true
      - name: Merge shard reports
        run: |
          mkdir -p merged-hunts
          while read -r base; do
            [ -n "$base" ] || continue
            if ./netdoc-sim hunt merge hunt-shards/"$base".*.json > "merged-hunts/$base.json"; then
              continue
            else
              status=$?
            fi
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
          done <<< "$HUNT_BASELINES"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hunt-results
          path: merged-hunts
          if-no-files-found: error
      # Reproduction still needs namespaces, but the expensive full hunts have
      # already run independently in the matrix.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: tc -V
      # One place decides whether this run may file issues, and says so in
      # words the summary can print verbatim.
      - id: mode
        env:
          DISPATCH_CREATE: ${{ inputs.create }}
          REPOSITORY_OPT_IN: ${{ vars.NETDOC_HUNT_CREATE }}
        run: |
          opt_in=$(printf '%s' "${REPOSITORY_OPT_IN:-}" | tr '[:upper:]' '[:lower:]')
          case "$GITHUB_EVENT_NAME:${DISPATCH_CREATE:-false}:$opt_in" in
            workflow_dispatch:true:*)
              create=1
              mode='explicitly creating issues (manual dispatch, create: true)' ;;
            schedule:*:true)
              create=1
              mode='scheduled creation enabled by repository variable NETDOC_HUNT_CREATE' ;;
            *)
              create=0
              mode='observation-only: hunting and reproducing, creating no issues' ;;
          esac
          echo "create=$create" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "$mode"
      - id: triage
        env:
          CREATE: ${{ steps.mode.outputs.create }}
          CASES: ${{ inputs.cases || '60' }}
          HUNT_SEED: ${{ needs.seed.outputs.value }}
          # gh reads the token from the environment; it is never an argument,
          # so it cannot reach a log line. An observation-only run gets no
          # token at all.
          GH_TOKEN: ${{ steps.mode.outputs.create == '1' && secrets.GITHUB_TOKEN || '' }}
        run: |
          args=()
          if [ "$CREATE" = "1" ]; then
            args+=(--create)
          fi
          ./netdoc-sim triage \
            --cases "$CASES" \
            --hunt-results merged-hunts \
            --seed "$HUNT_SEED" \
            "${args[@]}" \
            --revision "$GITHUB_SHA" \
            --context "GitHub Actions run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | tee triage.txt
      - if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          HUNT_SEED: ${{ needs.seed.outputs.value }}
        run: |
          {
            echo '### netdoc-sim hunt triage'
            echo ''
            echo "Mode: ${MODE:-mode was never decided; the run failed before triage}"
            echo "Exploration seed: ${HUNT_SEED:-seed was not resolved}"
            echo ''
            echo '```'
            cat triage.txt 2>/dev/null || echo 'the triage step produced no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
