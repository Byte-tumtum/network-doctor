name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
        env:
          CGO_ENABLED: "0"
      - run: go test ./...
      - run: go test -tags integration ./internal/diagnostic ./internal/simulation
      # Builds real network namespaces to run netdoc inside deliberately broken
      # networks. Rootless: it uses an unprivileged user namespace.
      #
      # NETDOC_SIM_REQUIRE_NETNS turns "this host cannot simulate" from a skip
      # into a failure. Without it a runner that loses unprivileged user
      # namespaces would go green while testing nothing, and a backend
      # regression would sit unnoticed until someone ran it locally.
      #
      # Ubuntu 24.04 and later ship AppArmor's unprivileged-userns restriction
      # on, which denies the backend the namespace it needs. Clearing it on the
      # throwaway runner keeps the tests rootless; netdoc-sim itself still
      # refuses to escalate.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Linux'
        run: go test -tags netns_integration -count=1 ./internal/simulation
        env:
          NETDOC_SIM_REQUIRE_NETNS: "1"
      # The job runner does concurrent subprocess cancellation; gate it.
      - if: runner.os == 'Linux'
        run: go test -race ./...
      # The loopback socket tests run servers and probes in parallel goroutines,
      # so they are worth racing too. Separate invocation: the tag changes the
      # build, and applying it to ./... would compile integration files into
      # every other package's test binary.
      - if: runner.os == 'Linux'
        run: go test -race -tags integration ./internal/diagnostic ./internal/simulation
      # Smoke-fuzz the two parsers fed by input we do not control — terminal
      # output and encrypted-DNS responses — so regressions don't rely on
      # contributors remembering to fuzz locally.
      - if: runner.os == 'Linux'
        run: go test -fuzz=FuzzSanitize -fuzztime=10s ./internal/textsafe
      - if: runner.os == 'Linux'
        run: go test -fuzz=FuzzEncryptedDNSResponseVerifier -fuzztime=10s ./internal/diagnostic
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Not go.mod: that pins the oldest *supported* toolchain, and
          # govulncheck reports every stdlib CVE patched since it. The test
          # matrix above still proves the code builds on that minimum.
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      # Validate the GoReleaser config here so breakage surfaces before tag day.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: check
