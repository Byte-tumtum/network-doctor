name: intermittent-dns
description: The configured resolver returns deterministic SERVFAIL responses before recovering.

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      resolver: 10.77.0.53
    - name: resolver
      address: 10.77.0.53
      services:
        - name: intermittent-resolver
          type: dns
          zone:
            flaky-target.test: 10.77.0.20
            connectivitycheck.gstatic.com: 10.77.0.1
          # Six per family, and every name walks the schedule on its own, so what
          # netdoc asks this resolver about the captive-portal host cannot move
          # the target's failure or its recovery.
          #
          # One netdoc run spends four queries per family on the target: the
          # stub resolver retries each SERVFAIL once, and netdoc resamples the
          # name once more before calling DNS unavailable. Four servfails is
          # therefore the whole first run. The second run starts at slot five,
          # so its own retry and resample reach the answers past the schedule,
          # and it recovers. Anything from three to six queries per run lands
          # the same way; the number is not on a knife edge.
          dns_fault:
            a: [servfail, servfail, servfail, servfail, servfail, servfail]
            aaaa: [servfail, servfail, servfail, servfail, servfail, servfail]
    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          zone:
            flaky-target.test: 10.77.0.20
            connectivitycheck.gstatic.com: 10.77.0.1
        - {type: http, port: 80}
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, zone: {connectivitycheck.gstatic.com: 10.77.0.1}}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}
    - name: target
      address: 10.77.0.20
      services:
        - {type: http, port: 80}

tests:
  - name: resolver temporarily fails
    node: client
    target: flaky-target.test:80
    expect:
      verdict: dns
      checks:
        - {id: internet_tcp, status: PASS}
        - {id: dns, status: FAIL, cause: dns_temporary_failure}
  - name: resolver recovers
    node: client
    target: flaky-target.test:80

expect:
  verdict: ok
  checks:
    - {id: internet_tcp, status: PASS}
    - {id: dns, status: PASS}
    - {id: target_tcp, status: PASS}
    - {id: http, status: PASS}
