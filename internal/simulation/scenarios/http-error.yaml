name: http-error
description: The target is reachable and deliberately returns HTTP 503.

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      resolver: 10.77.0.1
    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          zone:
            http-error.test: 10.77.0.20
            connectivitycheck.gstatic.com: 10.77.0.1
        - {type: http, port: 80}
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, zone: {connectivitycheck.gstatic.com: 10.77.0.1}}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}
    - name: target
      address: 10.77.0.20
      services:
        - {type: http, port: 8080, status: 503}

tests:
  - {name: endpoint returns a server error, node: client, target: 'http://http-error.test:8080'}

expect:
  verdict: ok
  checks:
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: PASS}
    - {id: dns, status: PASS}
    - {id: dns_public, status: PASS}
    - {id: target_tcp, status: PASS}
    - {id: path_mtu, status: PASS}
    - {id: http, status: PASS}
