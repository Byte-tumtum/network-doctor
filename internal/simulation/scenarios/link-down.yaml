name: link-down
description: >-
  The client's only interface is administratively down. There is no second
  link, no address to send from and no route to select, so every check below
  the interface is a consequence rather than a finding. Run without a target,
  because the first question netdoc has to answer is whether this machine has a
  network at all.

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      resolver: 10.77.0.1

    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          zone:
            connectivitycheck.gstatic.com: 10.77.0.1
        - type: http
          port: 80
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, zone: {connectivitycheck.gstatic.com: 10.77.0.1}}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}

faults:
  # "lan" is the segment the subnet shorthand builds, and the client has
  # exactly one interface on it. Taking that down leaves the client with
  # nothing but loopback, which is the case this scenario exists for: not a
  # router link, not one path of several, the only link there is.
  - {type: link_down, node: client, segment: lan}

tests:
  - name: the client's only link is down
    node: client

expect:
  verdict: network
  checks:
    # The whole diagnosis. Everything else hangs off this row in the probe
    # graph, so a dead link is reported once here rather than as a pile of
    # downstream failures.
    - {id: iface, status: FAIL}
    # Pinned as SKIP, not FAIL: egress never ran, so the link is the finding
    # and not a symptom the reader has to rank against others.
    - {id: internet_tcp, status: SKIP}
