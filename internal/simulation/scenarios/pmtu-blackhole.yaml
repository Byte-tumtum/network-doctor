name: pmtu-blackhole
description: >-
  Two routers are joined by a narrow transit link, and both discard the ICMP
  fragmentation-needed replies they would send about it. The endpoints keep
  believing the path carries 1500 bytes, so anything needing a full-size packet
  vanishes with nothing to report it: bulk TCP never drains and the TLS
  handshake times out, while DNS, the TCP handshakes themselves, and small HTTP
  replies keep crossing the same routers unharmed.

topology:
  segments:
    - {name: client-lan, subnet: 10.77.1.0/24}
    - {name: transit, subnet: 10.77.2.0/24}
    - {name: server-lan, subnet: 10.77.3.0/24}
  nodes:
    - name: client
      role: client
      resolver: 10.77.3.20
      interfaces:
        - {segment: client-lan, address: 10.77.1.10/24}

    - name: edge
      role: router
      interfaces:
        - {segment: client-lan, address: 10.77.1.1/24}
        - {segment: transit, address: 10.77.2.1/24}

    - name: core
      role: router
      interfaces:
        - {segment: transit, address: 10.77.2.2/24}
        - {segment: server-lan, address: 10.77.3.1/24}

    - name: internet
      interfaces:
        - {segment: server-lan, address: 10.77.3.20/24}
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - name: pmtu-resolver
          type: dns
          zone:
            pmtu-target.test: 10.77.3.30
            connectivitycheck.gstatic.com: 10.77.3.20
        - {name: internet-http, type: http, port: 80}
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, zone: {connectivitycheck.gstatic.com: 10.77.3.20}}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}

    - name: target
      interfaces:
        - {segment: server-lan, address: 10.77.3.30/24}
      services:
        - {name: pmtu-http, type: http, port: 80}
        - {name: pmtu-tls, type: tls, port: 443, certificate: {mode: valid, dns_names: [pmtu-target.test]}}
  routes:
    - {node: client, destination: default, via: 10.77.1.1}
    - {node: edge, destination: default, via: 10.77.2.2}
    - {node: core, destination: 10.77.1.0/24, via: 10.77.2.1}
    - {node: core, destination: 1.1.1.1/32, via: 10.77.3.20}
    - {node: core, destination: 8.8.8.8/32, via: 10.77.3.20}
    - {node: internet, destination: 10.77.1.0/24, via: 10.77.3.1}
    - {node: target, destination: 10.77.1.0/24, via: 10.77.3.1}

# Both ends of the transit link, so the black hole is symmetric: neither the
# client's bulk write nor the server's TLS flight is ever told why it vanished.
faults:
  - {type: pmtu_blackhole, node: edge, segment: transit, mtu: 576}
  - {type: pmtu_blackhole, node: core, segment: transit, mtu: 576}

tests:
  - name: bulk transfer and the TLS handshake both stall
    node: client
    target: pmtu-target.test:443
    trust: {service: pmtu-tls}

  # The control: the same client, the same two routers, the same narrowed hop.
  # Only the packet size differs, and small packets are untouched.
  - name: small HTTP still crosses the same black-holed path
    node: client
    target: pmtu-target.test:80
    expect:
      verdict: degraded
      checks:
        - {id: target_tcp, status: PASS}
        - {id: http, status: PASS}
        - {id: quic_udp_443, status: FAIL}
        - {id: dns_encrypted, status: FAIL}
        # The bulk write is black-holed here too — the probe measures the path,
        # not the target's port. What differs is the verdict: with HTTP
        # answering, no second probe corroborates the stall, so the run stays
        # degraded instead of naming the path.
        - {id: path_mtu, status: WARN}

expect:
  verdict: network
  checks:
    # Everything that fits in 576 bytes crosses both routers normally, which is
    # what makes this a black hole rather than a broken path.
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: PASS}
    - {id: dns, status: PASS}
    - {id: dns_public, status: PASS}
    - {id: target_tcp, status: PASS}
    # The server's TLS flight is larger than the narrowed hop carries, and no
    # router is willing to say so, so the handshake stalls to its deadline.
    - {id: tls, status: FAIL, cause: timeout}
    - {id: https, status: SKIP}
    # The bulk write is black-holed exactly like the TLS flight: all 24 KiB is
    # accepted by the local kernel and none of it is ever acknowledged. Reading
    # the socket's send queue is what separates the two — a completed Write says
    # only that Linux took the bytes. Together with the TLS timeout above, this
    # row is what turns the verdict from service to network.
    - {id: path_mtu, status: WARN}
    # A 576-byte hop cannot carry QUIC's 1200-byte initial packets or the
    # encrypted-DNS handshake either; both are consequences, not the fault.
    - {id: quic_udp_443, status: FAIL}
    - {id: dns_encrypted, status: FAIL}
