name: healthy-network
description: >-
  Everything works: the resolver answers, direct egress reaches the simulated
  internet, and the service on the far end replies. The control for every other
  scenario — anything netdoc flags here is a false positive.

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      resolver: 10.77.0.1

    # netdoc's egress and public-DNS probes dial fixed public addresses that are
    # compiled into the binary. Inside the simulation this node claims them, so
    # the probes exercise their real code path without a packet leaving the
    # namespace.
    #
    # These mirror internetEndpoints4 and publicDNSIP in
    # internal/diagnostic/checks.go, and the zone below mirrors probeHost. This
    # scenario is the canary for that coupling: change those constants without
    # updating every scenario here and `netdoc-sim run healthy` turns FAIL,
    # naming the probe that drifted. That failure is deliberate — see the
    # endpoint-drift section of docs/simulation.md.
    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          zone:
            example.test: 10.77.0.20
            connectivitycheck.gstatic.com: 10.77.0.1
        - type: http
          port: 80
        - type: tcp
          port: 443

    - name: server
      address: 10.77.0.20
      services:
        - type: http
          port: 80

tests:
  - name: healthy target
    node: client
    target: example.test:80

expect:
  verdict: ok
  checks:
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: PASS}
    - {id: dns, status: PASS}
    - {id: dns_public, status: PASS}
    - {id: target_tcp, status: PASS}
    - {id: http, status: PASS}
