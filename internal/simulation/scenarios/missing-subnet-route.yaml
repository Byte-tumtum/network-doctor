name: missing-subnet-route
description: Internet routing stays healthy, but the client lacks the route through the router for the target subnet.

topology:
  segments:
    - {name: client-lan, subnet: 10.77.1.0/24}
    - {name: internet-lan, subnet: 10.77.2.0/24}
    - {name: target-lan, subnet: 10.77.3.0/24}
  nodes:
    - name: client
      role: client
      resolver: 10.77.2.20
      interfaces:
        - {segment: client-lan, address: 10.77.1.10/24}
    - name: internet-gateway
      role: router
      interfaces:
        - {segment: client-lan, address: 10.77.1.1/24}
        - {segment: internet-lan, address: 10.77.2.1/24}
    - name: target-gateway
      role: router
      interfaces:
        - {segment: client-lan, address: 10.77.1.254/24}
        - {segment: target-lan, address: 10.77.3.1/24}
    - name: internet
      interfaces:
        - {segment: internet-lan, address: 10.77.2.20/24}
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          zone:
            subnet-target.test: 10.77.3.20
            connectivitycheck.gstatic.com: 10.77.2.20
        - {type: http, port: 80}
        - {type: tcp, port: 443}
    - name: target
      interfaces:
        - {segment: target-lan, address: 10.77.3.20/24}
      services:
        - {type: http, port: 80}
  routes:
    - {node: client, destination: default, via: 10.77.1.1}
    - {node: internet-gateway, destination: 1.1.1.1/32, via: 10.77.2.20}
    - {node: internet-gateway, destination: 8.8.8.8/32, via: 10.77.2.20}
    - {node: internet, destination: 10.77.1.0/24, via: 10.77.2.1}
    - {node: target, destination: 10.77.1.0/24, via: 10.77.3.1}

tests:
  - {name: target subnet needs a missing specific route, node: client, target: subnet-target.test:80}

expect:
  verdict: service
  checks:
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: PASS}
    - {id: dns, status: PASS}
    - {id: dns_public, status: PASS}
    - {id: target_tcp, status: FAIL}
    - {id: path_mtu, status: SKIP}
