name: gateway-unreachable
description: >-
  A valid default route remains installed, but its on-link next hop has no
  owner. This differs from no-default-route: kernel route selection succeeds,
  then neighbor discovery for the configured gateway fails.

topology:
  segments:
    - {name: client-lan, subnet: 10.77.1.0/24}
    - {name: upstream, subnet: 10.77.2.0/24}
  nodes:
    - name: client
      role: client
      resolver: 10.77.2.20
      interfaces:
        - {segment: client-lan, address: 10.77.1.10/24}
    - name: gateway
      role: router
      interfaces:
        - {segment: client-lan, address: 10.77.1.1/24}
        - {segment: upstream, address: 10.77.2.1/24}
    - name: target
      interfaces:
        - {segment: upstream, address: 10.77.2.20/24}
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - name: routed-resolver
          type: dns
          zone: {connectivitycheck.gstatic.com: 10.77.2.20}
        - {name: routed-http, type: http, port: 80}
        - {name: routed-tls-control, type: tcp, port: 443}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}
  routes:
    - {node: client, destination: default, via: 10.77.1.1}
    - {node: gateway, destination: 1.1.1.1/32, via: 10.77.2.20}
    - {node: gateway, destination: 8.8.8.8/32, via: 10.77.2.20}
    - {node: target, destination: 10.77.1.0/24, via: 10.77.2.1}

faults:
  - {type: replace_default_route, node: client, via: 10.77.1.254}

tests:
  - name: configured gateway cannot answer neighbor discovery
    node: client

expect:
  verdict: network
  checks:
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: FAIL, cause: gateway_unreachable}
    - {id: dns, status: FAIL}
