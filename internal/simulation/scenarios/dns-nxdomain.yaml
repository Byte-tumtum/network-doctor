name: dns-nxdomain
description: The configured resolver answers NXDOMAIN for the target while IP connectivity remains healthy.

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      resolver: 10.77.0.1
    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          zone:
            connectivitycheck.gstatic.com: 10.77.0.1
        - {type: http, port: 80}
        - {type: tcp, port: 443}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}

tests:
  - {name: target name does not exist, node: client, target: missing.test:80}

expect:
  verdict: dns
  checks:
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: PASS}
    - {id: dns, status: FAIL}
    - {id: dns_public, status: PASS}
    - {id: target_tcp, status: SKIP}
    - {id: http, status: SKIP}
