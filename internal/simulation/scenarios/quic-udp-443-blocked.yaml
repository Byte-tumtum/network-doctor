name: quic-udp-443-blocked
description: TCP/443 remains healthy while the Internet endpoint silently drops QUIC traffic on UDP/443.

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      resolver: 10.77.0.1

    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          zone:
            example.test: 10.77.0.20
            connectivitycheck.gstatic.com: 10.77.0.1
        - {type: http, port: 80}
        - {type: tcp, port: 443}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}

    - name: server
      address: 10.77.0.20
      services:
        - {type: http, port: 80}

faults:
  - {type: drop, node: internet, direction: inbound, protocol: udp, port: 443}

tests:
  - name: TCP healthy but QUIC silently dropped
    node: client
    target: example.test:80

expect:
  verdict: degraded
  checks:
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: PASS}
    - {id: quic_udp_443, status: FAIL, cause: timeout}
    - {id: dns, status: PASS}
    - {id: target_tcp, status: PASS}
    - {id: http, status: PASS}
