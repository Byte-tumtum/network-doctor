name: tcp-reset
description: A peer accepts TCP and then resets the protocol connection before sending an SSH banner.

topology:
  subnet: 10.77.0.0/24
  nodes:
    - name: client
      role: client
      address: 10.77.0.10
      gateway: 10.77.0.1
      resolver: 10.77.0.1
    - name: internet
      address: 10.77.0.1
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - type: dns
          zone:
            reset-target.test: 10.77.0.20
            connectivitycheck.gstatic.com: 10.77.0.1
        - {type: http, port: 80}
        - {type: tcp, port: 443}
    - name: target
      address: 10.77.0.20
      services:
        - {name: reset-target, type: tcp_reset, port: 2222}

tests:
  - {name: accepted then reset, node: client, target: 'ssh://reset-target.test:2222'}

expect:
  verdict: service
  checks:
    - {id: internet_tcp, status: PASS}
    - {id: dns, status: PASS}
    - {id: target_tcp, status: PASS}
    - {id: ssh_banner, status: FAIL, cause: connection_reset}
