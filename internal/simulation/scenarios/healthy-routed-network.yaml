name: healthy-routed-network
description: >-
  Client and destination occupy distinct L2 segments joined only by a router.
  The router forwards inside its own namespace, and every real netdoc probe
  reaches local simulator services across that routed path.

topology:
  segments:
    - {name: client-lan, subnet: 10.77.1.0/24}
    - {name: upstream, subnet: 10.77.2.0/24}
  nodes:
    - name: client
      role: client
      resolver: 10.77.2.20
      interfaces:
        - {segment: client-lan, address: 10.77.1.10/24}

    - name: gateway
      role: router
      interfaces:
        - {segment: client-lan, address: 10.77.1.1/24}
        - {segment: upstream, address: 10.77.2.1/24}

    - name: target
      interfaces:
        - {segment: upstream, address: 10.77.2.20/24}
      aliases: [1.1.1.1, 8.8.8.8]
      services:
        - name: routed-resolver
          type: dns
          zone:
            routed-target.test: 10.77.2.20
            connectivitycheck.gstatic.com: 10.77.2.20
        - {name: routed-http, type: http, port: 80}
        - {name: routed-tls-control, type: tcp, port: 443}
  routes:
    - {node: client, destination: default, via: 10.77.1.1}
    - {node: gateway, destination: 1.1.1.1/32, via: 10.77.2.20}
    - {node: gateway, destination: 8.8.8.8/32, via: 10.77.2.20}
    - {node: target, destination: 10.77.1.0/24, via: 10.77.2.1}

tests:
  - name: healthy traffic crosses the router
    node: client
    target: routed-target.test:80

expect:
  verdict: ok
  checks:
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: PASS}
    - {id: dns, status: PASS}
    - {id: dns_public, status: PASS}
    - {id: target_tcp, status: PASS}
    - {id: http, status: PASS}
