name: dual-stack-healthy
description: >-
  A client and target carry IPv4 and IPv6 on the same logical links. Both
  families cross the same two-interface router and reach simulator-owned
  endpoints without using the public Internet.

topology:
  segments:
    - {name: client-lan, ipv4: 10.78.1.0/24, ipv6: 2001:db8:77:1::/64}
    - {name: upstream, ipv4: 10.78.2.0/24, ipv6: 2001:db8:77:2::/64}
  nodes:
    - name: client
      role: client
      resolver: 10.78.1.53
      interfaces:
        - {segment: client-lan, ipv4: 10.78.1.10/24, ipv6: 2001:db8:77:1::10/64}

    - name: resolver
      interfaces:
        - {segment: client-lan, ipv4: 10.78.1.53/24, ipv6: 2001:db8:77:1::53/64}
      services:
        - name: dual-resolver
          type: dns
          records:
            - {name: dual-target.test, address: 10.78.2.20}
            - {name: dual-target.test, address: 2001:db8:77:2::20}
            - {name: connectivitycheck.gstatic.com, address: 10.78.2.20}
            - {name: connectivitycheck.gstatic.com, address: 2001:db8:77:2::20}

    - name: gateway
      role: router
      interfaces:
        - {segment: client-lan, ipv4: 10.78.1.1/24, ipv6: 2001:db8:77:1::1/64}
        - {segment: upstream, ipv4: 10.78.2.1/24, ipv6: 2001:db8:77:2::1/64}

    - name: target
      interfaces:
        - {segment: upstream, ipv4: 10.78.2.20/24, ipv6: 2001:db8:77:2::20/64}
      aliases: [1.1.1.1, 8.8.8.8, "2606:4700:4700::1111", "2001:4860:4860::8888"]
      services:
        - name: public-resolver
          type: dns
          records:
            - {name: dual-target.test, address: 10.78.2.20}
            - {name: dual-target.test, address: 2001:db8:77:2::20}
            - {name: connectivitycheck.gstatic.com, address: 10.78.2.20}
            - {name: connectivitycheck.gstatic.com, address: 2001:db8:77:2::20}
        - {name: dual-http, type: http, port: 80}
        - {name: internet-encrypted-dns, type: encrypted_dns, port: 443, certificate: {mode: valid, dns_names: [cloudflare-dns.com]}, records: [{name: connectivitycheck.gstatic.com, address: 10.78.2.20}]}
        - {name: internet-quic, type: quic, port: 443, certificate: {mode: valid, dns_names: [connectivitycheck.gstatic.com]}}
  routes:
    - {node: client, destination: default, via: 10.78.1.1}
    - {node: client, destination: "::/0", via: "2001:db8:77:1::1"}
    - {node: gateway, destination: 1.1.1.1/32, via: 10.78.2.20}
    - {node: gateway, destination: 8.8.8.8/32, via: 10.78.2.20}
    - {node: gateway, destination: "2606:4700:4700::1111/128", via: "2001:db8:77:2::20"}
    - {node: gateway, destination: "2001:4860:4860::8888/128", via: "2001:db8:77:2::20"}
    - {node: target, destination: 10.78.1.0/24, via: 10.78.2.1}
    - {node: target, destination: "2001:db8:77:1::/64", via: "2001:db8:77:2::1"}

tests:
  - {name: both address families cross the router, node: client, target: dual-target.test:80}

expect:
  verdict: ok
  checks:
    - {id: iface, status: PASS}
    - {id: internet_tcp, status: PASS, ipv4: reachable, ipv6: reachable}
    - {id: dns, status: PASS}
    - {id: dns_public, status: PASS}
    - {id: target_tcp, status: PASS}
    - {id: http, status: PASS}
