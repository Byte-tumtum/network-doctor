version: "2"

# `golangci-lint run` reports formatter diffs as findings, so the existing lint
# step gates formatting too — no separate gofmt job to keep in sync.
formatters:
  enable:
    - gofmt

linters:
  settings:
    errcheck:
      # Writes to stdout/stderr and deferred closes on read-only fds carry no
      # actionable error; checking them is pure noise in this codebase.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - syscall.Close
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (net.Conn).Close
        - (net.Conn).SetReadDeadline
        - (net.Conn).SetWriteDeadline
